<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRI Trainer — Standing Supported Passive Left AF IR</title>
  <style>
    /* ============================================================
       RESET AND BASE STYLES
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-alt: #242836;
      --primary: #4f8cff;
      --primary-hover: #3a74e0;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #e8eaed;
      --text-dim: #9ca3af;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      text-align: center;
      line-height: 1.4;
      color: var(--primary);
    }

    /* ============================================================
       STATUS PANEL
       ============================================================ */
    .status-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .status-label {
      color: var(--text-dim);
      font-weight: 500;
    }

    .status-value {
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* State color coding */
    .state-setup { color: var(--warning); }
    .state-breathe { color: var(--success); }
    .state-rest { color: var(--primary); }
    .state-complete { color: var(--success); }
    .state-idle { color: var(--text-dim); }

    /* ============================================================
       BREATHING VISUAL INDICATOR
       ============================================================ */
    .breath-visual {
      width: 100%;
      height: 8px;
      background: var(--surface-alt);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }

    .breath-visual.active {
      display: block;
    }

    .breath-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width linear;
    }

    .breath-fill.inhale {
      background: var(--success);
    }

    .breath-fill.exhale {
      background: var(--primary);
    }

    /* ============================================================
       CUE TEXT DISPLAY
       ============================================================ */
    .cue-display {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text);
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .controls {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #2e3345;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ============================================================
       ERROR BANNER
       ============================================================ */
    .error-banner {
      background: #3b1111;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 1rem;
      color: var(--danger);
      font-size: 0.9rem;
      display: none;
    }

    .error-banner.visible {
      display: block;
    }

    /* ============================================================
       MODAL OVERLAY
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 1.25rem;
      position: relative;
    }

    .modal-content img {
      width: 100%;
      border-radius: 8px;
    }

    .modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: var(--surface-alt);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 400px) {
      body { padding: 0.5rem; }
      h1 { font-size: 1.1rem; }
      .cue-display { font-size: 1rem; min-height: 60px; }
    }
  </style>
</head>
<body>

  <div class="app">
    <h1 id="exerciseTitle">PRI Trainer</h1>

    <!-- Error banner for missing speech API -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Status panel showing current state, set, breath, timer -->
    <div class="status-panel">
      <div class="status-row">
        <span class="status-label">Current State</span>
        <span class="status-value state-idle" id="stateDisplay">Idle</span>
      </div>
      <div class="status-row">
        <span class="status-label">Set</span>
        <span class="status-value" id="setDisplay">0 of 4</span>
      </div>
      <div class="status-row">
        <span class="status-label">Breath</span>
        <span class="status-value" id="breathDisplay">0 of 4</span>
      </div>
      <div class="status-row">
        <span class="status-label">Rest Timer</span>
        <span class="status-value" id="restDisplay">&mdash;</span>
      </div>
    </div>

    <!-- Breathing progress bar -->
    <div class="breath-visual" id="breathVisual">
      <div class="breath-fill" id="breathFill"></div>
    </div>

    <!-- Live spoken cue text -->
    <div class="cue-display" id="cueDisplay">Press Start to begin your session.</div>

    <!-- Action buttons -->
    <div class="controls">
      <button class="btn btn-primary" id="startPauseBtn">Start</button>
      <button class="btn btn-secondary" id="refBtn">Visual Reference</button>
    </div>
  </div>

  <!-- Visual reference modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <img src="movement1 visual.png" alt="Standing Supported Passive Left AF IR demonstration"
           onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<p style=\'color:#9ca3af;text-align:center;padding:2rem;\'>Place <code>movement1 visual.png</code> in the project root to see the visual reference.</p>')" />
    </div>
  </div>

<script>
/* ==============================================================
   PHASE 1: EXERCISE DATA MODULE
   Extracted directly from the reference image.
   Structured for easy extension with additional exercises.
   ============================================================== */
const EXERCISES = {
  standingSupportedPassiveLeftAFIR: {
    title: "Standing Supported Passive Left AF IR",
    steps: [
      "Stand facing a table, desk or a counter top.",
      "Place a 2-inch block underneath your left foot.",
      "Place your right foot on the ground ahead of your left.",
      "Round out your back and place both hands on the surface.",
      "Shift your left hip back so that your pant zipper is towards your left big toe. Slightly bend your left knee. You should feel a stretch in your left outer hip (buttock). The majority of your weight should be on your left leg, through your left mid-foot/heel.",
      "Further round out your back by placing both forearms onto the surface.",
      "Hold this position while you take 4-5 deep breaths, in through your nose and out through your mouth, filling the back of your chest wall with air upon inhalation.",
      "Relax and repeat 4 more times."
    ],
    /* Image asset path for the visual reference modal */
    imageSrc: "movement1 visual.png"
  }
};

/* ==============================================================
   PHASE 3: AUDIO SCRIPT DEFINITIONS
   Precise cue strings for Web Speech API synthesis.
   ============================================================== */
const AUDIO_SCRIPTS = {
  /* Segment A: Full setup instructions spoken once at session start */
  setup:
    "Set up facing your surface. " +
    "Place the block under your left foot. " +
    "Step your right foot forward. " +
    "Round your back, hands on the surface. " +
    "Shift your left hip back, point your zipper toward your left big toe. " +
    "Feel that stretch in your outer left hip. " +
    "Keep most of your weight on your left mid foot and heel. " +
    "Watch that you do not lose that hip shift or put too much weight on your right leg. " +
    "Now further round your back and place your forearms down.",

  /* Segment B: Called per breath with dynamic set/breath numbers */
  breathIntro: (set, breath) =>
    `Hold this position. Prepare for set ${set}, breath ${breath}.`,
  inhale: "In through your nose.",
  inhaleFill: "Feel the back of your chest wall fill with air.",
  exhale: "And out through your mouth.",
  breathDone: "Breath complete. Maintain that hip position.",

  /* Segment C: Rest and completion */
  restStart: "Set complete. Rest for 30 seconds.",
  complete: "All sets complete. Great job."
};

/* ==============================================================
   PHASE 2: STATE MACHINE
   States: IDLE -> SETUP -> BREATHE -> REST -> (loop) -> COMPLETE
   ============================================================== */

/* ---- Configuration constants ---- */
const TOTAL_SETS = 4;
const BREATHS_PER_SET = 4;
const INHALE_SECONDS = 5;
const EXHALE_SECONDS = 7;
const REST_SECONDS = 30;

/* ---- State enum ---- */
const STATE = {
  IDLE: "Idle",
  SETUP: "Setup",
  BREATHE: "Breathe",
  REST: "Rest",
  COMPLETE: "Complete"
};

/* ---- Application state ---- */
let currentState = STATE.IDLE;
let currentSet = 0;
let currentBreath = 0;
let restRemaining = 0;
let isPaused = false;
let restIntervalId = null;
let breathTimeoutId = null;

/* ---- DOM references ---- */
const stateDisplay = document.getElementById("stateDisplay");
const setDisplay = document.getElementById("setDisplay");
const breathDisplay = document.getElementById("breathDisplay");
const restDisplay = document.getElementById("restDisplay");
const cueDisplay = document.getElementById("cueDisplay");
const startPauseBtn = document.getElementById("startPauseBtn");
const refBtn = document.getElementById("refBtn");
const modalOverlay = document.getElementById("modalOverlay");
const modalClose = document.getElementById("modalClose");
const errorBanner = document.getElementById("errorBanner");
const breathVisual = document.getElementById("breathVisual");
const breathFill = document.getElementById("breathFill");
const exerciseTitle = document.getElementById("exerciseTitle");

/* Set the page title from exercise data */
exerciseTitle.textContent = EXERCISES.standingSupportedPassiveLeftAFIR.title;

/* ==============================================================
   WEB SPEECH API: ERROR HANDLING AND SYNTHESIS
   The app checks for browser support on load.
   If missing, it shows an error in both the UI and the console.
   ============================================================== */
let speechSupported = false;

function checkSpeechSupport() {
  if (!("speechSynthesis" in window)) {
    const msg = "Web Speech API not supported in this browser. Audio cues will not play.";
    console.error("[PRI Trainer] " + msg);
    errorBanner.textContent = msg;
    errorBanner.classList.add("visible");
    return false;
  }
  speechSupported = true;
  return true;
}

/**
 * Speak a text string using Web Speech API.
 * Returns a Promise that resolves when the utterance finishes.
 * If speech is not supported, it resolves immediately.
 */
function speak(text) {
  return new Promise((resolve) => {
    setCue(text);
    if (!speechSupported) {
      /* Resolve after a brief pause so the user can still read the cue */
      setTimeout(resolve, 1500);
      return;
    }
    /* Cancel any queued utterances before speaking */
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.92;
    utterance.pitch = 1;
    utterance.onend = resolve;
    utterance.onerror = (e) => {
      console.error("[PRI Trainer] Speech error:", e.error);
      resolve();
    };
    window.speechSynthesis.speak(utterance);
  });
}

/* ==============================================================
   UI UPDATE HELPERS
   ============================================================== */

/** Update the state indicator with proper color class */
function setStateUI(state) {
  currentState = state;
  stateDisplay.textContent = state;
  stateDisplay.className = "status-value";
  const classMap = {
    [STATE.IDLE]: "state-idle",
    [STATE.SETUP]: "state-setup",
    [STATE.BREATHE]: "state-breathe",
    [STATE.REST]: "state-rest",
    [STATE.COMPLETE]: "state-complete"
  };
  stateDisplay.classList.add(classMap[state] || "state-idle");
}

function updateSetUI() {
  setDisplay.textContent = `${currentSet} of ${TOTAL_SETS}`;
}

function updateBreathUI() {
  breathDisplay.textContent = `${currentBreath} of ${BREATHS_PER_SET}`;
}

function updateRestUI(seconds) {
  restDisplay.textContent = seconds > 0 ? `${seconds}s` : "\u2014";
}

function setCue(text) {
  cueDisplay.textContent = text;
}

/* ---- Breathing progress bar ---- */
function showBreathBar(phase, durationMs) {
  breathVisual.classList.add("active");
  breathFill.className = "breath-fill " + phase;
  breathFill.style.transition = "none";
  breathFill.style.width = "0%";
  /* Force reflow before starting the animation */
  void breathFill.offsetWidth;
  breathFill.style.transition = `width ${durationMs}ms linear`;
  breathFill.style.width = "100%";
}

function hideBreathBar() {
  breathVisual.classList.remove("active");
  breathFill.style.width = "0%";
}

/* ==============================================================
   PAUSE AND RESUME LOGIC
   Pausing cancels speech and stops timers.
   Resuming replays the current state from where it left off.
   ============================================================== */

function cancelAllTimers() {
  if (restIntervalId) { clearInterval(restIntervalId); restIntervalId = null; }
  if (breathTimeoutId) { clearTimeout(breathTimeoutId); breathTimeoutId = null; }
  window.speechSynthesis.cancel();
  hideBreathBar();
}

/* ==============================================================
   TIMED PAUSE UTILITY
   Returns a promise that resolves after the given milliseconds.
   It stores the timeout ID so pausing can cancel it.
   ============================================================== */
function timedPause(ms) {
  return new Promise((resolve) => {
    breathTimeoutId = setTimeout(() => {
      breathTimeoutId = null;
      resolve();
    }, ms);
  });
}

/* ==============================================================
   STATE MACHINE TRANSITIONS
   Each state function is async. The machine flows linearly:
     enterSetup -> enterBreathe (loops breaths) -> enterRest (loops sets) -> enterComplete
   ============================================================== */

/**
 * SETUP STATE
 * Speaks the full setup script (Segment A).
 * Then automatically transitions to the first breathing cycle.
 */
async function enterSetup() {
  if (isPaused) return;
  setStateUI(STATE.SETUP);
  currentSet = 1;
  currentBreath = 0;
  updateSetUI();
  updateBreathUI();
  updateRestUI(0);

  await speak(AUDIO_SCRIPTS.setup);

  /* Small pause before the first breath cycle */
  if (isPaused) return;
  await timedPause(1500);

  /* Transition: SETUP -> BREATHE */
  if (!isPaused) enterBreathe();
}

/**
 * BREATHE STATE
 * Runs a single breath: inhale cue -> 5s hold -> exhale cue -> 7s hold.
 * Increments the breath counter. After BREATHS_PER_SET, transitions to REST.
 */
async function enterBreathe() {
  if (isPaused) return;
  setStateUI(STATE.BREATHE);
  currentBreath++;
  updateBreathUI();

  /* Announce the upcoming breath */
  await speak(AUDIO_SCRIPTS.breathIntro(currentSet, currentBreath));
  if (isPaused) return;

  /* ---- INHALE phase ---- */
  await speak(AUDIO_SCRIPTS.inhale);
  if (isPaused) return;

  /* Show the inhale progress bar for 5 seconds */
  showBreathBar("inhale", INHALE_SECONDS * 1000);
  setCue("Inhale... feel the back of your chest wall fill with air.");
  await timedPause(INHALE_SECONDS * 1000);
  if (isPaused) return;
  hideBreathBar();

  /* ---- EXHALE phase ---- */
  await speak(AUDIO_SCRIPTS.exhale);
  if (isPaused) return;

  /* Show the exhale progress bar for 7 seconds */
  showBreathBar("exhale", EXHALE_SECONDS * 1000);
  setCue("Exhale slowly through your mouth...");
  await timedPause(EXHALE_SECONDS * 1000);
  if (isPaused) return;
  hideBreathBar();

  /* Post breath confirmation */
  await speak(AUDIO_SCRIPTS.breathDone);
  if (isPaused) return;

  /* ---- Decide next transition ---- */
  if (currentBreath < BREATHS_PER_SET) {
    /* More breaths remain in this set. Loop back. */
    await timedPause(1000);
    if (!isPaused) enterBreathe();
  } else {
    /* All breaths done for this set. Transition: BREATHE -> REST or COMPLETE */
    if (currentSet < TOTAL_SETS) {
      enterRest();
    } else {
      enterComplete();
    }
  }
}

/**
 * REST STATE
 * Speaks the rest cue. Runs a 30 second visible countdown.
 * After the countdown, increments the set and loops back to BREATHE.
 */
async function enterRest() {
  if (isPaused) return;
  setStateUI(STATE.REST);
  restRemaining = REST_SECONDS;
  updateRestUI(restRemaining);

  await speak(AUDIO_SCRIPTS.restStart);
  if (isPaused) return;

  /* Start the countdown interval (ticks every second) */
  await new Promise((resolve) => {
    restIntervalId = setInterval(() => {
      if (isPaused) {
        clearInterval(restIntervalId);
        restIntervalId = null;
        resolve();
        return;
      }
      restRemaining--;
      updateRestUI(restRemaining);
      setCue(`Rest: ${restRemaining}s remaining`);

      if (restRemaining <= 0) {
        clearInterval(restIntervalId);
        restIntervalId = null;
        resolve();
      }
    }, 1000);
  });

  if (isPaused) return;
  updateRestUI(0);

  /* Transition: REST -> BREATHE (next set) */
  currentSet++;
  currentBreath = 0;
  updateSetUI();
  updateBreathUI();

  if (!isPaused) enterBreathe();
}

/**
 * COMPLETE STATE
 * Speaks the completion cue and resets the UI for a new session.
 */
async function enterComplete() {
  setStateUI(STATE.COMPLETE);
  updateRestUI(0);
  await speak(AUDIO_SCRIPTS.complete);

  setCue("Session finished. Press Start to go again.");
  startPauseBtn.textContent = "Start";
  isPaused = false;
  currentState = STATE.IDLE;
}

/* ==============================================================
   BUTTON HANDLERS
   ============================================================== */

startPauseBtn.addEventListener("click", () => {
  if (currentState === STATE.IDLE || currentState === STATE.COMPLETE) {
    /* Fresh start */
    isPaused = false;
    startPauseBtn.textContent = "Pause";
    enterSetup();
  } else if (isPaused) {
    /* Resume from pause */
    isPaused = false;
    startPauseBtn.textContent = "Pause";
    setCue("Resuming...");

    /* Re-enter the current state at the right point */
    if (currentState === STATE.SETUP) {
      enterSetup();
    } else if (currentState === STATE.BREATHE) {
      /* Restart the current breath */
      currentBreath--;
      enterBreathe();
    } else if (currentState === STATE.REST) {
      enterRest();
    }
  } else {
    /* Pause the session */
    isPaused = true;
    cancelAllTimers();
    startPauseBtn.textContent = "Resume";
    setCue("Paused. Press Resume to continue.");
  }
});

/* ---- Visual Reference Modal ---- */
refBtn.addEventListener("click", () => {
  modalOverlay.classList.add("open");
});

modalClose.addEventListener("click", () => {
  modalOverlay.classList.remove("open");
});

modalOverlay.addEventListener("click", (e) => {
  /* Close when clicking the backdrop, not the modal content */
  if (e.target === modalOverlay) {
    modalOverlay.classList.remove("open");
  }
});

/* ---- Keyboard: Escape closes the modal ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalOverlay.classList.contains("open")) {
    modalOverlay.classList.remove("open");
  }
});

/* ==============================================================
   INITIALIZATION
   Check speech support on page load.
   ============================================================== */
checkSpeechSupport();
</script>

</body>
</html>
