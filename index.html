<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRI Trainer — Standing Supported Passive Left AF IR</title>
  <style>
    /* ============================================================
       RESET AND BASE STYLES
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-alt: #242836;
      --primary: #4f8cff;
      --primary-hover: #3a74e0;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #e8eaed;
      --text-dim: #9ca3af;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      text-align: center;
      line-height: 1.4;
      color: var(--primary);
    }

    /* ============================================================
       STATUS PANEL
       ============================================================ */
    .status-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .status-label {
      color: var(--text-dim);
      font-weight: 500;
    }

    .status-value {
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* State color coding */
    .state-setup { color: var(--warning); }
    .state-breathe { color: var(--success); }
    .state-rest { color: var(--primary); }
    .state-complete { color: var(--success); }
    .state-idle { color: var(--text-dim); }

    /* ============================================================
       BREATHING VISUAL INDICATOR
       ============================================================ */
    .breath-visual {
      width: 100%;
      height: 8px;
      background: var(--surface-alt);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }

    .breath-visual.active {
      display: block;
    }

    .breath-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width linear;
    }

    .breath-fill.inhale {
      background: var(--success);
    }

    .breath-fill.exhale {
      background: var(--primary);
    }

    /* ============================================================
       CUE TEXT DISPLAY
       ============================================================ */
    .cue-display {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text);
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .controls {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #2e3345;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ============================================================
       ERROR BANNER
       ============================================================ */
    .error-banner {
      background: #3b1111;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 1rem;
      color: var(--danger);
      font-size: 0.9rem;
      display: none;
    }

    .error-banner.visible {
      display: block;
    }

    /* ============================================================
       MODAL OVERLAY
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 1.25rem;
      position: relative;
    }

    .modal-content img {
      width: 100%;
      border-radius: 8px;
    }

    .modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: var(--surface-alt);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       COMPLETION CELEBRATION OVERLAY
       ============================================================ */
    .celebration-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .celebration-overlay.visible {
      display: flex;
      opacity: 1;
    }

    .celebration-overlay.fading {
      opacity: 0;
    }

    .celebration-card {
      background: linear-gradient(135deg, #1a1d27 0%, #242836 100%);
      border: 2px solid var(--success);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 60px rgba(52, 211, 153, 0.3);
    }

    .celebration-overlay.visible .celebration-card {
      transform: scale(1);
    }

    .celebration-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .celebration-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 0.5rem;
    }

    .celebration-subtitle {
      font-size: 1rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ============================================================
       CONFETTI CANVAS
       Positioned behind the celebration card, above everything else.
       ============================================================ */
    .confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 210;
      pointer-events: none;
    }

    /* ============================================================
       TAB BAR
       Segmented control for switching between movements.
       ============================================================ */
    .tabs {
      display: flex;
      gap: 0.35rem;
      background: var(--surface);
      padding: 0.35rem;
      border-radius: var(--radius);
    }

    .tab {
      flex: 1;
      padding: 0.7rem 0.4rem;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.3;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .tab:hover { color: var(--text); }
    .tab:active { transform: scale(0.97); }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .tab:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================================
       TITLE BLOCK
       ============================================================ */
    .subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: var(--text-dim);
      margin-top: -0.5rem;
      letter-spacing: 0.02em;
    }

    /* Shared visibility helper */
    .hidden { display: none !important; }

    /* ============================================================
       FOCUS NOTE
       The key coaching correction, surfaced in the reference modal.
       ============================================================ */
    .focus-note {
      background: var(--surface-alt);
      border-left: 3px solid var(--warning);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text);
    }

    .focus-note h2 {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--warning);
      margin-bottom: 0.5rem;
      padding-right: 2.5rem;
    }

    /* Fallback message when a movement image is missing */
    .modal-fallback {
      display: none;
      color: var(--text-dim);
      text-align: center;
      padding: 2rem;
      font-size: 0.95rem;
    }

    .modal-fallback.visible { display: block; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 400px) {
      body { padding: 0.5rem; }
      h1 { font-size: 1.1rem; }
      .tab { font-size: 0.78rem; padding: 0.6rem 0.3rem; }
      .cue-display { font-size: 1rem; min-height: 60px; }
      .celebration-card { padding: 2rem 1.25rem; }
      .celebration-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Movement tabs -->
    <div class="tabs" id="tabBar" role="tablist" aria-label="Choose a movement"></div>

    <h1 id="exerciseTitle">PRI Trainer</h1>
    <p class="subtitle hidden" id="exerciseSubtitle"></p>

    <!-- Error banner for missing speech API -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Status panel showing current state, set, breath, timer -->
    <div class="status-panel">
      <div class="status-row">
        <span class="status-label">Current State</span>
        <span class="status-value state-idle" id="stateDisplay">Idle</span>
      </div>
      <div class="status-row">
        <span class="status-label">Set</span>
        <span class="status-value" id="setDisplay">0 of 4</span>
      </div>
      <div class="status-row hidden" id="phaseRow">
        <span class="status-label">Phase</span>
        <span class="status-value" id="phaseDisplay">&mdash;</span>
      </div>
      <div class="status-row">
        <span class="status-label">Breath</span>
        <span class="status-value" id="breathDisplay">0 of 4</span>
      </div>
      <div class="status-row">
        <span class="status-label">Rest Timer</span>
        <span class="status-value" id="restDisplay">&mdash;</span>
      </div>
    </div>

    <!-- Breathing progress bar -->
    <div class="breath-visual" id="breathVisual">
      <div class="breath-fill" id="breathFill"></div>
    </div>

    <!-- Live spoken cue text -->
    <div class="cue-display" id="cueDisplay">Press Start to begin your session.</div>

    <!-- Action buttons -->
    <div class="controls">
      <button class="btn btn-primary" id="startPauseBtn">Start</button>
      <button class="btn btn-secondary" id="refBtn">Visual Reference</button>
    </div>
  </div>

  <!-- Visual reference modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="focus-note hidden" id="focusNote">
        <h2>Your Focus</h2>
        <p id="focusNoteText"></p>
      </div>
      <img id="refImage" alt="Exercise visual reference" />
      <p class="modal-fallback" id="refFallback"></p>
    </div>
  </div>

  <!-- Completion celebration overlay -->
  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-card">
      <span class="celebration-icon">&#10024;</span>
      <div class="celebration-title">Movement Complete</div>
      <div class="celebration-subtitle" id="celebrationSubtitle"></div>
    </div>
  </div>

  <!-- Confetti canvas renders on top of everything -->
  <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<script>
/* ==============================================================
   EXERCISE LIBRARY
   Each movement is a self-contained config object holding its copy,
   timing, spoken scripts, and the PHASE STRUCTURE of a single set.
   The state machine further down is generic: it reads only from the
   currently active exercise, never from module-level constants. That
   means adding a third movement is purely a matter of adding another
   entry to this object plus one <button> in the tab bar.
   ============================================================== */
const EXERCISES = {

  /* ------------------------------------------------------------
     MOVEMENT 1 — Standing Supported Passive Left AF IR
     A flat movement: one phase of 4 identical breaths per set.
     ------------------------------------------------------------ */
  standingLeftAFIR: {
    tabLabel: "Standing<br>Left AF IR",
    title: "Standing Supported Passive Left AF IR",
    subtitle: "",
    imageSrc: "movement1 visual.png",
    imageAlt: "Standing Supported Passive Left AF IR demonstration",

    /* The single most common way this movement goes wrong. Shown in the
       reference modal; its two halves are also woven into the spoken
       setup and inhale cues so they land in the moment. */
    focusNote:
      "When you place your forearms down, do not just collapse your chest toward the table. " +
      "Instead, actively press your elbows and forearms into the surface to push your spine " +
      "away from the table. This protracts your shoulder blades (moves them apart) and rounds " +
      "your thoracic spine. As you inhale, direct all the air into the space between your " +
      "shoulder blades to fill the back of your chest wall.",

    totalSets: 4,
    inhaleSeconds: 5,
    exhaleSeconds: 7,
    restSeconds: 30,

    steps: [
      "Stand facing a table, desk or a counter top.",
      "Place a 2-inch block underneath your left foot.",
      "Place your right foot on the ground ahead of your left.",
      "Round out your back and place both hands on the surface.",
      "Shift your left hip back so that your pant zipper is towards your left big toe. Slightly bend your left knee. You should feel a stretch in your left outer hip (buttock). The majority of your weight should be on your left leg, through your left mid-foot/heel.",
      "Further round out your back by placing both forearms onto the surface. Do not collapse your chest toward the table \u2014 actively press your elbows and forearms into the surface to push your spine away from it. This protracts your shoulder blades and rounds your thoracic spine.",
      "Hold this position while you take 4-5 deep breaths, in through your nose and out through your mouth, directing the air into the space between your shoulder blades to fill the back of your chest wall.",
      "Relax and repeat 4 more times."
    ],

    /* Segment A: full setup instructions, spoken at session start and
       replayed between sets so the position gets rebuilt each time. */
    setupScript:
      "Set up facing your surface. " +
      "Place the block under your left foot. " +
      "Step your right foot forward. " +
      "Round your back, hands on the surface. " +
      "Shift your left hip back, point your zipper toward your left big toe. " +
      "Feel that stretch in your outer left hip. " +
      "Keep most of your weight on your left mid foot and heel. " +
      "Watch that you do not lose that hip shift or put too much weight on your right leg. " +
      "Now further round your back and place your forearms down. " +
      "Do not collapse your chest toward the table. " +
      "Press your elbows and forearms down into the surface to push your spine away from it. " +
      "Feel your shoulder blades spread apart.",

    /* Segment C: rest and completion */
    restScript: "Set complete. Rest for 30 seconds.",
    completeScript: "All sets complete. Great job.",
    celebrationText: "You crushed all 4 sets. Your body thanks you.",

    /* Segment B: the phases of one set. A single unlabeled phase keeps
       this movement's behaviour byte-for-byte identical to before. */
    phases: [
      {
        label: null,
        breaths: 4,
        introScript: null,
        breathIntro: (set, breath) => `Set ${set}, breath ${breath}.`,
        inhaleScript: "In through your nose.",
        inhaleText: "Inhale... send the air into the space between your shoulder blades.",
        exhaleScript: "Out through your mouth.",
        exhaleText: "Exhale slowly through your mouth...",
        breathDoneScript: "Good."
      }
    ]
  },

  /* ------------------------------------------------------------
     MOVEMENT 2 — PRI Wall Supported Squat with Alternating
     Respiratory Trunk Rotation. For Standing Left Gluteus Medius.
     Two phases per set, with OPPOSITE reach timing:
       right arm reaches further on the EXHALE,
       left arm reaches further on the INHALE.
     ------------------------------------------------------------ */
  wallSupportedSquat: {
    tabLabel: "Wall Supported<br>Squat",
    title: "PRI Wall Supported Squat with Alternating Respiratory Trunk Rotation",
    subtitle: "For Standing Left Gluteus Medius",
    imageSrc: "movement2 visual.png",
    imageAlt: "PRI Wall Supported Squat with Alternating Respiratory Trunk Rotation demonstration",

    totalSets: 5,
    inhaleSeconds: 5,
    exhaleSeconds: 7,
    restSeconds: 45,

    steps: [
      "Stand with your heels 7-10 inches away from the wall.",
      "Place a 4-6 inch ball between your knees.",
      "Place your bottom on the wall and slide down by slightly bending your knees.",
      "Round out your back as you perform a pelvic tilt so that your low back is flat on the wall.",
      "Shift your left hip back. Your left knee will be slightly behind your right, and you will feel your left outside hip (buttock), front of your left thigh and left inner thigh engage.",
      "Maintaining the above position, reach forward and across the midline of your body with your right hand.",
      "Inhale through your nose and as you exhale through your mouth, reach further with your right arm. Repeat this breathing sequence for a total of 3 deep breaths in through your nose and out through your mouth, reaching a little further with your right arm each time you exhale.",
      "Now maintaining the above position (left hip shifted back), reach forward and across the midline of your body with your left hand.",
      "As you inhale through your nose, reach further with your left arm. Exhale and maintain the reach. Repeat this breathing sequence for a total of 3 deep breaths, in through your nose and out through your mouth, reaching a little further with your left arm each time you inhale. Attempt to fill or expand your left upper back as you inhale.",
      "Slowly stand up by pushing through your heels, keeping your lower back flat on the wall.",
      "Relax and repeat 4 more times."
    ],

    setupScript:
      "Set up with your heels seven to ten inches away from the wall. " +
      "Place a four to six inch ball between your knees. " +
      "Put your bottom on the wall and slide down by slightly bending your knees. " +
      "Round out your back and perform a pelvic tilt so your low back is flat against the wall. " +
      "Now shift your left hip back. Your left knee will sit slightly behind your right. " +
      "You should feel your left outside hip, the front of your left thigh, and your left inner thigh engage. " +
      "Squeeze the ball gently and hold that position.",

    restScript:
      "Set complete. Slowly stand up by pushing through your heels, " +
      "keeping your lower back flat on the wall. Rest for forty five seconds.",
    completeScript: "All five sets complete. Great job.",
    celebrationText: "You crushed all 5 sets. Your body thanks you.",

    phases: [
      {
        /* Phase 1 — right arm. The reach deepens on the EXHALE. */
        label: "Right arm reach",
        breaths: 3,
        introScript:
          "Maintaining that position, reach forward and across the midline " +
          "of your body with your right hand. " +
          "Each time you exhale, reach a little further with your right arm.",
        breathIntro: (set, breath) => `Set ${set}, right arm, breath ${breath}.`,
        inhaleScript: "In through your nose.",
        inhaleText: "Inhale through your nose... hold the reach.",
        exhaleScript: "Out through your mouth. Reach a little further with your right arm.",
        exhaleText: "Exhale... reach a little further with your right arm.",
        breathDoneScript: "Good. Keep that left hip back."
      },
      {
        /* Phase 2 — left arm. The reach deepens on the INHALE instead. */
        label: "Left arm reach",
        breaths: 3,
        introScript:
          "Now switch. Keep your left hip shifted back and reach forward " +
          "across the midline of your body with your left hand. " +
          "This time, each time you inhale, reach a little further with your left arm.",
        breathIntro: (set, breath) => `Set ${set}, left arm, breath ${breath}.`,
        inhaleScript: "In through your nose. Reach a little further with your left arm.",
        inhaleText: "Inhale... reach a little further with your left arm and fill your left upper back.",
        exhaleScript: "Out through your mouth. Maintain that reach.",
        exhaleText: "Exhale slowly... maintain the reach.",
        breathDoneScript: "Good. Stay low."
      }
    ]
  }
};

/* Tab order, and the exercise the app opens on. */
const EXERCISE_ORDER = ["standingLeftAFIR", "wallSupportedSquat"];
let activeKey = EXERCISE_ORDER[0];

/** The exercise config the state machine is currently driving. */
function active() {
  return EXERCISES[activeKey];
}

/** The phase object for the current position inside a set. */
function activePhase() {
  return active().phases[currentPhase];
}

/* ==============================================================
   STATE MACHINE
   States: IDLE -> SETUP -> BREATHE -> REST -> (loop) -> COMPLETE
   Within a set, BREATHE walks the exercise's phases in order:
     phase 0 breaths -> phase 1 breaths -> ... -> REST
   ============================================================== */

/* ---- State enum ---- */
const STATE = {
  IDLE: "Idle",
  SETUP: "Setup",
  BREATHE: "Breathe",
  REST: "Rest",
  COMPLETE: "Complete"
};

/* ---- Application state ---- */
let currentState = STATE.IDLE;
let currentSet = 0;
let currentPhase = 0;
let currentBreath = 0;
let restRemaining = 0;
let isPaused = false;
let restIntervalId = null;
let breathTimeoutId = null;

/* A run token. Every async chain captures the token it started under and
   bails the moment the token changes. Switching tabs or pressing Start
   bumps the token, which cleanly abandons any in-flight chain — timers
   and speech can be cancelled, but a Promise already awaited cannot, so
   the token is what actually stops an orphaned set from marching on. */
let runToken = 0;

/** True when the chain that owns `token` should stop: superseded or paused. */
function aborted(token) {
  return token !== runToken || isPaused;
}

/* ---- DOM references ---- */
const stateDisplay = document.getElementById("stateDisplay");
const setDisplay = document.getElementById("setDisplay");
const phaseRow = document.getElementById("phaseRow");
const phaseDisplay = document.getElementById("phaseDisplay");
const breathDisplay = document.getElementById("breathDisplay");
const restDisplay = document.getElementById("restDisplay");
const cueDisplay = document.getElementById("cueDisplay");
const startPauseBtn = document.getElementById("startPauseBtn");
const refBtn = document.getElementById("refBtn");
const modalOverlay = document.getElementById("modalOverlay");
const modalClose = document.getElementById("modalClose");
const refImage = document.getElementById("refImage");
const refFallback = document.getElementById("refFallback");
const focusNote = document.getElementById("focusNote");
const focusNoteText = document.getElementById("focusNoteText");
const errorBanner = document.getElementById("errorBanner");
const breathVisual = document.getElementById("breathVisual");
const breathFill = document.getElementById("breathFill");
const exerciseTitle = document.getElementById("exerciseTitle");
const exerciseSubtitle = document.getElementById("exerciseSubtitle");
const tabBar = document.getElementById("tabBar");
const celebrationSubtitle = document.getElementById("celebrationSubtitle");

/* ==============================================================
   WEB SPEECH API: ERROR HANDLING AND SYNTHESIS
   The app checks for browser support on load.
   If missing, it shows an error in both the UI and the console.
   ============================================================== */
let speechSupported = false;

function checkSpeechSupport() {
  if (!("speechSynthesis" in window)) {
    const msg = "Web Speech API not supported in this browser. Audio cues will not play.";
    console.error("[PRI Trainer] " + msg);
    errorBanner.textContent = msg;
    errorBanner.classList.add("visible");
    return false;
  }
  speechSupported = true;
  return true;
}

/**
 * Speak a text string using Web Speech API.
 * Returns a Promise that resolves when the utterance finishes.
 * If speech is not supported, it resolves immediately.
 */
function speak(text) {
  return new Promise((resolve) => {
    setCue(text);
    if (!speechSupported) {
      /* Resolve after a brief pause so the user can still read the cue */
      setTimeout(resolve, 1500);
      return;
    }
    /* Cancel any queued utterances before speaking */
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.92;
    utterance.pitch = 1;
    utterance.onend = resolve;
    utterance.onerror = (e) => {
      console.error("[PRI Trainer] Speech error:", e.error);
      resolve();
    };
    window.speechSynthesis.speak(utterance);
  });
}

/* ==============================================================
   UI UPDATE HELPERS
   ============================================================== */

/** Update the state indicator with proper color class */
function setStateUI(state) {
  currentState = state;
  stateDisplay.textContent = state;
  stateDisplay.className = "status-value";
  const classMap = {
    [STATE.IDLE]: "state-idle",
    [STATE.SETUP]: "state-setup",
    [STATE.BREATHE]: "state-breathe",
    [STATE.REST]: "state-rest",
    [STATE.COMPLETE]: "state-complete"
  };
  stateDisplay.classList.add(classMap[state] || "state-idle");
}

function updateSetUI() {
  setDisplay.textContent = `${currentSet} of ${active().totalSets}`;
}

/** The Phase row only exists for multi-phase movements. */
function updatePhaseUI() {
  const phases = active().phases;
  if (phases.length < 2) {
    phaseRow.classList.add("hidden");
    return;
  }
  phaseRow.classList.remove("hidden");
  const label = phases[currentPhase] ? phases[currentPhase].label : null;
  phaseDisplay.textContent =
    currentState === STATE.IDLE || currentState === STATE.COMPLETE
      ? "—"
      : `${label} (${currentPhase + 1} of ${phases.length})`;
}

function updateBreathUI() {
  breathDisplay.textContent = `${currentBreath} of ${activePhase().breaths}`;
}

function updateRestUI(seconds) {
  restDisplay.textContent = seconds > 0 ? `${seconds}s` : "—";
}

function setCue(text) {
  cueDisplay.textContent = text;
}

/* ---- Breathing progress bar ---- */
function showBreathBar(phase, durationMs) {
  breathVisual.classList.add("active");
  breathFill.className = "breath-fill " + phase;
  breathFill.style.transition = "none";
  breathFill.style.width = "0%";
  /* Force reflow before starting the animation */
  void breathFill.offsetWidth;
  breathFill.style.transition = `width ${durationMs}ms linear`;
  breathFill.style.width = "100%";
}

function hideBreathBar() {
  breathVisual.classList.remove("active");
  breathFill.style.width = "0%";
}

/* ==============================================================
   PAUSE AND RESUME LOGIC
   Pausing cancels speech and stops timers.
   Resuming replays the current state from where it left off.
   ============================================================== */

function cancelAllTimers() {
  if (restIntervalId) { clearInterval(restIntervalId); restIntervalId = null; }
  if (breathTimeoutId) { clearTimeout(breathTimeoutId); breathTimeoutId = null; }
  if (speechSupported) window.speechSynthesis.cancel();
  hideBreathBar();
}

/* ==============================================================
   TIMED PAUSE UTILITY
   Returns a promise that resolves after the given milliseconds.
   It stores the timeout ID so pausing can cancel it.
   ============================================================== */
function timedPause(ms) {
  return new Promise((resolve) => {
    breathTimeoutId = setTimeout(() => {
      breathTimeoutId = null;
      resolve();
    }, ms);
  });
}

/* ==============================================================
   STATE MACHINE TRANSITIONS
   Each state function is async and carries the run token it began
   under. The machine flows:
     startSession -> enterSetup -> enterPhase -> enterBreathe (loops)
       -> next phase, or enterRest (loops sets), or enterComplete
   ============================================================== */

/**
 * Begin a fresh session for the active exercise.
 * Counter resets live here — NOT in enterSetup — because enterSetup is
 * replayed between sets and must not rewind the set count.
 */
function startSession() {
  runToken++;
  isPaused = false;
  currentSet = 1;
  currentPhase = 0;
  currentBreath = 0;
  updateSetUI();
  updatePhaseUI();
  updateBreathUI();
  updateRestUI(0);
  enterSetup(runToken);
}

/**
 * SETUP STATE
 * Speaks the full setup script. Runs once at the start of the session
 * and again after every rest so the position is rebuilt each set.
 * Transitions to the first phase of the current set.
 */
async function enterSetup(token) {
  if (aborted(token)) return;
  setStateUI(STATE.SETUP);
  updatePhaseUI();

  await speak(active().setupScript);
  if (aborted(token)) return;

  /* Brief settle before the first breath cycle */
  await timedPause(1000);
  if (aborted(token)) return;

  /* Transition: SETUP -> BREATHE */
  enterPhase(token);
}

/**
 * PHASE ENTRY
 * Speaks the phase's positioning cue (the arm switch, for movement 2)
 * before handing off to the breath loop. Single-phase movements have
 * no intro script and fall straight through.
 */
async function enterPhase(token) {
  if (aborted(token)) return;
  setStateUI(STATE.BREATHE);
  currentBreath = 0;
  updatePhaseUI();
  updateBreathUI();

  /* No gap after the positioning cue \u2014 the phase flows straight
     into its first breath so the sequence does not stall. */
  const phase = activePhase();
  if (phase.introScript) {
    await speak(phase.introScript);
    if (aborted(token)) return;
  }

  enterBreathe(token);
}

/**
 * BREATHE STATE
 * Runs a single breath: inhale cue -> inhale hold -> exhale cue -> exhale hold.
 * After the phase's breath quota, advances to the next phase, then REST.
 */
async function enterBreathe(token) {
  if (aborted(token)) return;
  const ex = active();
  const phase = activePhase();

  setStateUI(STATE.BREATHE);
  currentBreath++;
  updatePhaseUI();
  updateBreathUI();

  /* Announce the upcoming breath */
  await speak(phase.breathIntro(currentSet, currentBreath));
  if (aborted(token)) return;

  /* ---- INHALE phase ---- */
  await speak(phase.inhaleScript);
  if (aborted(token)) return;

  showBreathBar("inhale", ex.inhaleSeconds * 1000);
  setCue(phase.inhaleText);
  await timedPause(ex.inhaleSeconds * 1000);
  if (aborted(token)) return;
  hideBreathBar();

  /* ---- EXHALE phase ---- */
  await speak(phase.exhaleScript);
  if (aborted(token)) return;

  showBreathBar("exhale", ex.exhaleSeconds * 1000);
  setCue(phase.exhaleText);
  await timedPause(ex.exhaleSeconds * 1000);
  if (aborted(token)) return;
  hideBreathBar();

  /* Post breath confirmation */
  await speak(phase.breathDoneScript);
  if (aborted(token)) return;

  /* ---- Decide next transition ---- */
  if (currentBreath < phase.breaths) {
    /* More breaths remain in this phase. Loop straight back \u2014 the
       natural gap between utterances is pause enough. */
    enterBreathe(token);
  } else if (currentPhase < ex.phases.length - 1) {
    /* Phase done, but the set has another phase (the arm switch). */
    currentPhase++;
    enterPhase(token);
  } else if (currentSet < ex.totalSets) {
    /* Whole set done. Transition: BREATHE -> REST */
    enterRest(token);
  } else {
    enterComplete(token);
  }
}

/**
 * REST STATE
 * Speaks the rest cue, then runs a visible countdown of the exercise's
 * rest length. Afterwards increments the set and replays SETUP.
 */
async function enterRest(token) {
  if (aborted(token)) return;
  const ex = active();
  setStateUI(STATE.REST);
  restRemaining = ex.restSeconds;
  updateRestUI(restRemaining);
  updatePhaseUI();

  await speak(ex.restScript);
  if (aborted(token)) return;

  /* Start the countdown interval (ticks every second) */
  await new Promise((resolve) => {
    restIntervalId = setInterval(() => {
      if (aborted(token)) {
        clearInterval(restIntervalId);
        restIntervalId = null;
        resolve();
        return;
      }
      restRemaining--;
      updateRestUI(restRemaining);
      setCue(`Rest: ${restRemaining}s remaining`);

      if (restRemaining <= 0) {
        clearInterval(restIntervalId);
        restIntervalId = null;
        resolve();
      }
    }, 1000);
  });

  if (aborted(token)) return;
  updateRestUI(0);

  /* Transition: REST -> SETUP (replay) -> BREATHE (next set) */
  currentSet++;
  currentPhase = 0;
  currentBreath = 0;
  updateSetUI();
  updatePhaseUI();
  updateBreathUI();

  enterSetup(token);
}

/**
 * COMPLETE STATE
 * Skips rest entirely after the final set.
 * Launches confetti, shows the celebration overlay, speaks the completion cue.
 * The overlay fades out after a few seconds and resets the UI.
 */
async function enterComplete(token) {
  if (token !== runToken) return;
  setStateUI(STATE.COMPLETE);
  updateRestUI(0);
  updatePhaseUI();

  /* Fire confetti and show the celebration card */
  launchConfetti();
  showCelebration();

  await speak(active().completeScript);
  if (token !== runToken) return;

  /* Hold the celebration for a moment so it sinks in */
  await timedPause(4000);
  if (token !== runToken) return;

  /* Fade out the celebration overlay */
  hideCelebration();

  setCue("Session finished. Press Start to go again.");
  startPauseBtn.textContent = "Start";
  isPaused = false;
  currentState = STATE.IDLE;
}

/* ==============================================================
   CELEBRATION: OVERLAY SHOW AND HIDE
   ============================================================== */
const celebrationOverlay = document.getElementById("celebrationOverlay");

function showCelebration() {
  celebrationOverlay.classList.remove("fading");
  celebrationOverlay.classList.add("visible");
}

function hideCelebration() {
  celebrationOverlay.classList.add("fading");
  /* Remove from DOM flow after the fade transition completes */
  setTimeout(() => {
    celebrationOverlay.classList.remove("visible", "fading");
  }, 500);
}

/* ==============================================================
   CONFETTI ENGINE
   Lightweight canvas confetti. Spawns colorful particles that
   fall with gravity and slight horizontal drift.
   ============================================================== */
const confettiCanvas = document.getElementById("confettiCanvas");
const ctx = confettiCanvas.getContext("2d");
let confettiParticles = [];
let confettiAnimId = null;

const CONFETTI_COLORS = [
  "#34d399", "#4f8cff", "#fbbf24", "#f87171",
  "#a78bfa", "#f472b6", "#38bdf8", "#fb923c"
];

function resizeConfettiCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}

/** Create a batch of confetti particles */
function spawnConfetti(count) {
  resizeConfettiCanvas();
  for (let i = 0; i < count; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height * -1,
      w: Math.random() * 10 + 6,
      h: Math.random() * 6 + 4,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }
}

/** Animate confetti particles on the canvas */
function animateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confettiParticles.forEach((p) => {
    p.x += p.vx;
    p.vy += 0.04;
    p.y += p.vy;
    p.rotation += p.rotationSpeed;

    /* Fade out particles near the bottom */
    if (p.y > confettiCanvas.height * 0.75) {
      p.opacity -= 0.015;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.globalAlpha = Math.max(p.opacity, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });

  /* Remove dead particles */
  confettiParticles = confettiParticles.filter((p) => p.opacity > 0);

  if (confettiParticles.length > 0) {
    confettiAnimId = requestAnimationFrame(animateConfetti);
  } else {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiAnimId = null;
  }
}

/** Launch the full confetti sequence: two bursts for extra impact */
function launchConfetti() {
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  confettiParticles = [];
  spawnConfetti(120);
  confettiAnimId = requestAnimationFrame(animateConfetti);

  /* Second burst after a short delay for a sustained effect */
  setTimeout(() => spawnConfetti(80), 600);
}

/* ==============================================================
   TAB BAR AND EXERCISE SWITCHING
   Tabs are generated from EXERCISE_ORDER so the markup never has to
   be kept in sync by hand. Switching tabs abandons any running
   session outright: bumping the run token orphans the in-flight
   async chain, and resetExercise clears timers, speech and counters.
   ============================================================== */

function buildTabs() {
  tabBar.innerHTML = "";
  EXERCISE_ORDER.forEach((key) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (key === activeKey ? " active" : "");
    btn.type = "button";
    btn.dataset.key = key;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", key === activeKey ? "true" : "false");
    btn.innerHTML = EXERCISES[key].tabLabel;
    btn.addEventListener("click", () => selectExercise(key));
    tabBar.appendChild(btn);
  });
}

function syncTabState() {
  tabBar.querySelectorAll(".tab").forEach((btn) => {
    const isActive = btn.dataset.key === activeKey;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-selected", isActive ? "true" : "false");
  });
}

/** Stop everything and return the UI to a clean Idle state. */
function resetSession() {
  runToken++;
  isPaused = false;
  cancelAllTimers();
  currentState = STATE.IDLE;
  currentSet = 0;
  currentPhase = 0;
  currentBreath = 0;
  hideCelebration();
  setStateUI(STATE.IDLE);
  startPauseBtn.textContent = "Start";
}

/** Paint every exercise-specific piece of the UI. */
function renderExercise() {
  const ex = active();

  exerciseTitle.textContent = ex.title;
  document.title = "PRI Trainer — " + ex.title;

  if (ex.subtitle) {
    exerciseSubtitle.textContent = ex.subtitle;
    exerciseSubtitle.classList.remove("hidden");
  } else {
    exerciseSubtitle.textContent = "";
    exerciseSubtitle.classList.add("hidden");
  }

  celebrationSubtitle.textContent = ex.celebrationText;

  /* Focus note is optional \u2014 only movements that have one show the panel. */
  if (ex.focusNote) {
    focusNoteText.textContent = ex.focusNote;
    focusNote.classList.remove("hidden");
  } else {
    focusNoteText.textContent = "";
    focusNote.classList.add("hidden");
  }

  /* Point the reference modal at this movement's sheet. The fallback
     message is shown by the image's error handler, wired up below. */
  refFallback.classList.remove("visible");
  refImage.classList.remove("hidden");
  refImage.alt = ex.imageAlt;
  refImage.src = ex.imageSrc;

  updateSetUI();
  updatePhaseUI();
  updateBreathUI();
  updateRestUI(0);
  setCue("Press Start to begin your session.");
}

function selectExercise(key) {
  if (key === activeKey) return;
  resetSession();
  activeKey = key;
  syncTabState();
  renderExercise();
}

/* If a movement image is missing from the project root, say so in the
   modal rather than showing a broken image icon. */
refImage.addEventListener("error", () => {
  refImage.classList.add("hidden");
  refFallback.textContent =
    `Place "${active().imageSrc}" in the project root to see the visual reference.`;
  refFallback.classList.add("visible");
});

/* ==============================================================
   BUTTON HANDLERS
   ============================================================== */

startPauseBtn.addEventListener("click", () => {
  if (currentState === STATE.IDLE || currentState === STATE.COMPLETE) {
    /* Fresh start */
    startPauseBtn.textContent = "Pause";
    startSession();
  } else if (isPaused) {
    /* Resume from pause */
    isPaused = false;
    startPauseBtn.textContent = "Pause";
    setCue("Resuming...");

    /* Re-enter the current state at the right point */
    if (currentState === STATE.SETUP) {
      enterSetup(runToken);
    } else if (currentState === STATE.BREATHE) {
      if (currentBreath === 0) {
        /* Paused during the phase intro — replay the positioning cue */
        enterPhase(runToken);
      } else {
        /* Restart the breath that was interrupted */
        currentBreath--;
        enterBreathe(runToken);
      }
    } else if (currentState === STATE.REST) {
      enterRest(runToken);
    }
  } else {
    /* Pause the session */
    isPaused = true;
    cancelAllTimers();
    startPauseBtn.textContent = "Resume";
    setCue("Paused. Press Resume to continue.");
  }
});

/* ---- Visual Reference Modal ---- */
refBtn.addEventListener("click", () => {
  modalOverlay.classList.add("open");
});

modalClose.addEventListener("click", () => {
  modalOverlay.classList.remove("open");
});

modalOverlay.addEventListener("click", (e) => {
  /* Close when clicking the backdrop, not the modal content */
  if (e.target === modalOverlay) {
    modalOverlay.classList.remove("open");
  }
});

/* ---- Keyboard: Escape closes the modal ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalOverlay.classList.contains("open")) {
    modalOverlay.classList.remove("open");
  }
});

/* ==============================================================
   INITIALIZATION
   Check speech support on load. Build tabs, paint the default
   exercise, and size the confetti canvas.
   ============================================================== */
checkSpeechSupport();
buildTabs();
renderExercise();
setStateUI(STATE.IDLE);
resizeConfettiCanvas();
window.addEventListener("resize", resizeConfettiCanvas);

</script>

</body>
